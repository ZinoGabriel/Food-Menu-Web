<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍔 MENU 🍕</h1>
    </header>

    <main class="menu-grid">
        <div class="menu-item">
            <img src="burger pic.webp" alt="Burger & Fries">
            <p class="item-name">Burger & Fries</p>
            <p class="price">$10</p>
        </div>
        <div class="menu-item">
            <img src="photo-1626700051175-6818013e1d4f.avif" alt="Burrito">
            <p class="item-name">Burrito</p>
            <p class="price">$12</p>
        </div>
        <div class="menu-item">
            <img src="pizza.jpg" alt="Pizza">
            <p class="item-name">Pizza</p>
            <p class="price">$15</p>
        </div>
        <div class="menu-item">
            <img src="victor-rutka-4FujjkcI40g-unsplash.jpg" alt="Milkshake">
            <p class="item-name">Milkshake</p>
            <p class="price">$7</p>
        </div>
        <div class="menu-item">
            <img src="tania-melnyczuk-xeTv9N2FjXA-unsplash.jpg" alt="Salad">
            <p class="item-name">Salad</p>
            <p class="price">$6.5</p>
        </div>
        <div class="menu-item">
            <img src="bryam-blanco-nXKWLn8y9qE-unsplash.jpg" alt="Chocolate Cupcake">
            <p class="item-name">Chocolate Cupcake</p>
            <p class="price">$5</p>
        </div>
    </main>

    <footer>
        <h2>✨ Thank You For Visiting Our Menu ✨</h2>
    </footer>

    <script src="script.js"></script>
</body>
</html>
